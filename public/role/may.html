<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tổ trưởng chuyền may - DVT Giám sát</title>
<link rel="stylesheet" href="/css/style.css">
<script src="/js/common.js"></script>
</head>
<body>
<main>
  <h1>Tổ trưởng chuyền may</h1>
  <div class="panel">
    <div class="filters">
      <label>Tổ <select id="to"></select></label>
      <label>Ngày <input type="date" id="ngay"></label>
      <a class="btn" id="linkBTP" href="/lean/dat-btp.html">Phiếu cấp BTP của tổ →</a>
    </div>
  </div>
  <div class="cards" id="cards"></div>
  <div class="panel">
    <h2>Sản lượng theo giờ (HiPro)</h2>
    <div id="gio"></div>
  </div>
  <div class="panel">
    <h2>PO đang may</h2>
    <div id="po"></div>
    <div class="note">Nguồn: Report_BaoCaoMayRa, lấy bản ghi mới nhất trong ngày của từng PO.</div>
  </div>
</main>
<script>
  ngay.value = App.today();

  async function loadTo() {
    const list = await App.api('to', { xn: App.xn });
    const want = new URLSearchParams(location.search).get('to');
    to.innerHTML = list.map((t) => `<option value="${App.esc(t.ma)}">${App.esc(t.ten)}</option>`).join('');
    if (want && list.some((t) => t.ma === want)) to.value = want;
    load();
  }

  async function load() {
    const q = { xn: App.xn, d: ngay.value };
    linkBTP.href = `/lean/dat-btp.html?xn=${App.xn}&to=${encodeURIComponent(to.value)}`;
    [gio, po].forEach(App.loading);
    const safe = (p) => p.catch((e) => ({ error: e }));
    const [kh, sl, ld, pos] = await Promise.all(['ke-hoach-ngay', 'san-luong-gio', 'lao-dong', 'po-may-ra'].map((u) => safe(App.api(u, q))));
    const mine = (rows) => (rows.error ? [] : rows.filter((r) => r.line === to.value));

    const gioRows = mine(sl);
    const hours = Array.from({ length: 14 }, (_, i) => i + 1);
    const lastH = Math.max(0, ...hours.filter((h) => gioRows.some((r) => r[`h${h}`] > 0)));
    gioRows.forEach((r) => (r.tong = hours.reduce((s, h) => s + (r[`h${h}`] || 0), 0)));
    const mayRa = gioRows.reduce((s, r) => s + r.tong, 0);
    const keHoach = mine(kh).reduce((s, r) => s + Number(r.keHoach || 0), 0);
    const lao = mine(ld)[0];

    App.cards(cards, [
      { label: 'Kế hoạch ngày', value: App.num(Math.round(keHoach)) },
      { label: 'May ra (HiPro)', value: App.num(mayRa), sub: lastH ? `đến giờ thứ ${lastH}` : 'chưa có số liệu' },
      { label: 'Đạt kế hoạch', value: App.pctTag(mayRa, keHoach) },
      { label: 'Lao động hiện diện', value: lao ? `${App.num(lao.hienDien)} / ${App.num(lao.tong)}` : '-', sub: lao && lao.hienDien ? `${(mayRa / lao.hienDien).toFixed(1)} SP/người` : '' },
    ]);

    if (sl.error) App.error(gio, sl.error);
    else App.table(gio, [
      { key: 'maHang', label: 'Mã hàng' },
      ...hours.slice(0, Math.max(lastH, 1)).map((h) => ({ key: `h${h}`, label: `Giờ ${h}`, type: 'num', sum: true })),
      { key: 'tong', label: 'Tổng', type: 'num', sum: true },
    ], gioRows, { footer: true, empty: 'Chưa có sản lượng HiPro cho tổ trong ngày' });

    if (pos.error) App.error(po, pos.error);
    else App.table(po, [
      { key: 'po', label: 'PO' },
      { key: 'lenhSX', label: 'Lệnh SX' },
      { key: 'maHang', label: 'Mã hàng' },
      { key: 'khachHang', label: 'Khách hàng' },
      { key: 'soLuong', label: 'SL PO', type: 'num', sum: true },
      { key: 'vaoChuyenLK', label: 'Vào chuyền LK', type: 'num', sum: true },
      { key: 'mayRaNgay', label: 'May ra ngày', type: 'num', sum: true },
      { key: 'mayRaLK', label: 'May ra LK', type: 'num', sum: true },
      { key: 'conLai', label: 'Còn lại', type: 'num', sum: true, value: (r) => Math.max((r.soLuong || 0) - (r.mayRaLK || 0), 0), render: (r) => App.num(Math.max((r.soLuong || 0) - (r.mayRaLK || 0), 0)) },
      { key: 'tt', label: 'Hoàn thành', render: (r) => App.pctTag(r.mayRaLK || 0, r.soLuong), total: (rs) => App.pctTag(rs.reduce((s, r) => s + (r.mayRaLK || 0), 0), rs.reduce((s, r) => s + (r.soLuong || 0), 0)) },
      { key: 'ngayXuat', label: 'Ngày xuất hàng', type: 'date' },
    ], mine(pos), { footer: true, empty: 'Không có PO may trong ngày' });
  }

  to.onchange = ngay.onchange = load;
  App.header([['Trang chính', '/'], ['Tổ trưởng chuyền may']], loadTo).then(loadTo);
</script>
</body>
</html>
