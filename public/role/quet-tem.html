<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quét tem QR - DVT Giám sát</title>
<link rel="stylesheet" href="/css/style.css">
<script src="/js/common.js"></script>
<script src="/js/vendor/jsQR.js"></script>
</head>
<body>
<main>
  <!-- Trang riêng tra tem: dùng chung public/js/quet-tem.js với trang tổ trưởng may, hộp tra tem hiện sẵn trong trang (qr-noi) -->
  <div id="hopQR" class="hop-qr qr-noi">
    <div class="hop-qr-khung">
      <div class="hcb-dau"><b>Quét tem QR</b>
        <button type="button" id="nutQR" class="nut-qr" title="Chụp tem để tra" aria-label="Chụp tem để tra"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><rect x="8" y="8" width="3" height="3"/><rect x="13" y="8" width="3" height="3"/><rect x="8" y="13" width="3" height="3"/><path d="M13 13h3v3"/></svg></button>
        <button type="button" id="qrDong" hidden></button>
      </div>
      <div class="hcb-than">
        <div id="qrTrangThai" class="qr-trang-thai">Bấm "Chụp tem" để mở camera chụp mã QR, hoặc gõ / bắn mã vào ô dưới</div>
        <div class="qr-nhap">
          <input id="qrNhap" placeholder="Gõ hoặc bắn mã tem" autocomplete="off">
          <button type="button" id="qrTra">Tra</button>
          <input type="file" id="qrChup" accept="image/*" capture="environment" hidden>
          <button type="button" id="qrQuetLai">Chụp tem</button>
        </div>
        <div id="qrKetQua"></div>
      </div>
    </div>
  </div>
</main>
<script>
  App.header([['Trang chính', '/'], ['Quét tem QR']]);
</script>
<script src="/js/quet-tem.js"></script>
</body>
</html>
