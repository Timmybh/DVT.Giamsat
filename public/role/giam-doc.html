<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giám đốc xí nghiệp - DVT Giám sát</title>
<link rel="stylesheet" href="/css/style.css">
<script src="/js/common.js"></script>
</head>
<body>
<main>
  <h1>Giám đốc xí nghiệp</h1>
  <div class="panel">
    <div class="filters">
      <label>Ngày <input type="date" id="ngay"></label>
    </div>
  </div>
  <div class="cards" id="cards"></div>
  <div class="panel">
    <h2>Theo tổ</h2>
    <div id="theoTo"></div>
    <div class="note">Kế hoạch: OMM_KeHoachThang. May ra: HiPro. Lao động: LCD_Truc_Quan_ChuyenMay_LaoDong.</div>
  </div>
  <div class="panel">
    <h2>Doanh thu theo ngày (tháng đang xem)</h2>
    <div id="doanhThu"></div>
  </div>
</main>
<script>
  ngay.value = App.today();

  async function load() {
    const d = ngay.value;
    const dau = d.slice(0, 8) + '01';
    [theoTo, doanhThu].forEach(App.loading);
    const safe = (p) => p.catch((e) => ({ error: e }));
    const q = { xn: App.xn, d };
    const [tos, kh, sl, ld, qc, dt] = await Promise.all([
      App.api('to', { xn: App.xn }), safe(App.api('ke-hoach-ngay', q)), safe(App.api('san-luong-gio', q)), safe(App.api('lao-dong', q)),
      safe(App.api('qc-loi', { xn: App.xn, tuNgay: d, denNgay: d })), safe(App.api('doanh-thu', { xn: App.xn, tuNgay: dau, denNgay: d })),
    ]);
    const list = (r) => (r.error ? [] : r);

    // Gom theo tổ
    const rows = tos.map((t) => ({ line: t.ma, ten: t.ten, maHang: [], keHoach: 0, mayRa: 0, tong: 0, hienDien: 0 }));
    const get = (line) => rows.find((r) => r.line === line) || (rows.push({ line, ten: `Tổ ${line}`, maHang: [], keHoach: 0, mayRa: 0, tong: 0, hienDien: 0 }), rows[rows.length - 1]);
    list(kh).forEach((r) => (get(r.line).keHoach += Number(r.keHoach || 0)));
    list(sl).forEach((r) => {
      const x = get(r.line);
      for (let h = 1; h <= 14; h++) x.mayRa += Number(r[`h${h}`] || 0);
      if (r.maHang && !x.maHang.includes(r.maHang)) x.maHang.push(r.maHang);
    });
    list(ld).forEach((r) => { const x = get(r.line); x.tong += Number(r.tong || 0); x.hienDien += Number(r.hienDien || 0); });
    rows.forEach((r) => (r.keHoach = Math.round(r.keHoach)));
    const data = rows.filter((r) => r.keHoach || r.mayRa || r.tong);
    const S = (k) => data.reduce((s, r) => s + r[k], 0);

    const dts = list(dt);
    const dtNgay = dts.find((r) => App.ymd(r.ngay) === d);
    const dtKH = dts.reduce((s, r) => s + Number(r.keHoach || 0), 0);
    const dtTH = dts.reduce((s, r) => s + Number(r.thucHien || 0), 0);
    const loi = list(qc).reduce((s, r) => s + Number(r.soLoi || 0), 0);

    App.cards(cards, [
      { label: 'May ra / kế hoạch', value: `${App.num(S('mayRa'))} / ${App.num(S('keHoach'))}`, sub: `Đạt ${App.pct(S('mayRa'), S('keHoach'))}` },
      { label: 'Lao động hiện diện', value: `${App.num(S('hienDien'))} / ${App.num(S('tong'))}`, sub: `Tỷ lệ ${App.pct(S('hienDien'), S('tong'))}` },
      { label: 'Doanh thu ngày', value: dtNgay ? App.num(dtNgay.thucHien) : '-', sub: dtNgay ? `Kế hoạch ${App.num(dtNgay.keHoach)}` : (dt.error ? 'lỗi đọc dữ liệu' : 'chưa khai báo') },
      { label: 'Doanh thu lũy kế tháng', value: App.num(dtTH), sub: `Kế hoạch ${App.num(dtKH)} · đạt ${App.pct(dtTH, dtKH)}` },
      { label: 'Lỗi QC trong ngày', value: qc.error ? '-' : App.num(loi), sub: 'Inline + Endline + Đầu chuyền + Final' },
    ]);

    App.table(theoTo, [
      { key: 'ten', label: 'Tổ' },
      { key: 'maHang', label: 'Mã hàng', render: (r) => App.esc(r.maHang.join(', ')) },
      { key: 'keHoach', label: 'Kế hoạch', type: 'num', sum: true },
      { key: 'mayRa', label: 'May ra', type: 'num', sum: true },
      { key: 'dat', label: 'Đạt', render: (r) => App.pctTag(r.mayRa, r.keHoach), total: (rs) => App.pctTag(rs.reduce((s, r) => s + r.mayRa, 0), rs.reduce((s, r) => s + r.keHoach, 0)) },
      { key: 'tong', label: 'LĐ tổng', type: 'num', sum: true },
      { key: 'hienDien', label: 'LĐ hiện diện', type: 'num', sum: true },
      { key: 'ns', label: 'SP/người', type: 'num', render: (r) => (r.hienDien ? (r.mayRa / r.hienDien).toFixed(1) : '') },
    ], data, { footer: true, empty: 'Chưa có số liệu trong ngày' });

    if (dt.error) App.error(doanhThu, dt.error);
    else App.table(doanhThu, [
      { key: 'ngay', label: 'Ngày', type: 'date' },
      { key: 'keHoach', label: 'Kế hoạch', type: 'num', sum: true },
      { key: 'thucHien', label: 'Thực hiện', type: 'num', sum: true },
      { key: 'conLai', label: 'Còn lại', type: 'num', sum: true },
      { key: 'dat', label: 'Đạt', render: (r) => App.pctTag(r.thucHien || 0, r.keHoach), total: (rs) => App.pctTag(dtTH, dtKH) },
    ], [...dts].reverse(), { footer: true, empty: 'Chưa khai báo doanh thu trong tháng' });
  }

  ngay.onchange = load;
  App.header([['Trang chính', '/'], ['Giám đốc xí nghiệp']], load).then(load);
</script>
</body>
</html>
