<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tình hình đặt BTP - DVT Giám sát</title>
<link rel="stylesheet" href="/css/style.css">
<script src="/js/common.js"></script>
</head>
<body>
<main>
  <h1>Tình hình đặt bán thành phẩm</h1>
  <div class="tabs">
    <button data-tab="tabPhieu" class="active">Theo phiếu cấp</button>
    <button data-tab="tabChiTiet">Chi tiết đặt BTP</button>
  </div>
  <section id="tabPhieu">
  <div class="panel">
    <div class="filters">
      <label>Ngày nhận BTP từ <input type="date" id="tuNgay"></label>
      <label>đến <input type="date" id="denNgay"></label>
    </div>
    <h2>Chọn tổ</h2>
    <div class="to-list" id="toList"></div>
  </div>
  <div class="panel">
    <h2>Phiếu cấp BTP <span id="toName"></span></h2>
    <div id="phieuCap"><div class="empty">Chọn tổ để xem phiếu cấp BTP</div></div>
  </div>
  <div class="panel">
    <h2>Chi tiết đặt <span class="pcName"></span></h2>
    <div id="chiTiet"><div class="empty">Click vào một phiếu cấp BTP để xem chi tiết</div></div>
  </div>
  <div class="panel">
    <h2>Tem BTP khâu cắt đã xuất <span class="pcName"></span></h2>
    <div id="phieuXuat"><div class="empty">Click vào một phiếu cấp BTP để xem tem đã xuất</div></div>
  </div>
  </section>
  <section id="tabChiTiet" hidden>
  <div class="panel">
    <div class="filters">
      <label>Tổ <select id="ctTo"><option value="">Tất cả</option></select></label>
      <label>Ngày nhận BTP từ <input type="date" id="ctTuNgay"></label>
      <label>đến <input type="date" id="ctDenNgay"></label>
      <label>Lệnh SX <input id="ctLenh" placeholder="VD: TUNTT-0634"></label>
      <label>PO <input id="ctPO"></label>
      <button id="ctBtn">Xem</button>
    </div>
    <div id="ctResult"><div class="empty">Chọn điều kiện rồi bấm Xem</div></div>
  </div>
  </section>
</main>
<script>
  const iso = (d) => d.toISOString().slice(0, 10);
  tuNgay.value = iso(new Date(Date.now() - 30 * 86400000));
  denNgay.value = iso(new Date(Date.now() + 7 * 86400000));
  let toDangChon;

  const status = (r) => {
    const pct = r.slDat ? (r.slXuat / r.slDat) * 100 : 0;
    const cls = pct >= 100 ? 'ok' : pct > 0 ? 'warn' : 'bad';
    return `<span class="tag ${cls}">${pct.toFixed(0)}%</span>`;
  };
  const resetDetail = () => {
    document.querySelectorAll('.pcName').forEach((e) => (e.textContent = ''));
    chiTiet.innerHTML = '<div class="empty">Click vào một phiếu cấp BTP để xem chi tiết</div>';
    phieuXuat.innerHTML = '<div class="empty">Click vào một phiếu cấp BTP để xem tem đã xuất</div>';
  };

  async function loadTo() {
    const list = await App.api('to', { xn: App.xn });
    toList.innerHTML = list.map((t) => `<button data-ma="${App.esc(t.ma)}">${App.esc(t.ten)}</button>`).join('');
    toList.querySelectorAll('button').forEach((b) => b.onclick = () => {
      toList.querySelectorAll('.active').forEach((x) => x.classList.remove('active'));
      b.classList.add('active');
      toDangChon = { ma: b.dataset.ma, ten: b.textContent };
      loadPhieuCap();
    });
    toDangChon = null;
    toName.textContent = '';
    phieuCap.innerHTML = '<div class="empty">Chọn tổ để xem phiếu cấp BTP</div>';
    resetDetail();
    // Mở từ trang Tổ trưởng may: ?to=7 chọn sẵn tổ
    const want = new URLSearchParams(location.search).get('to');
    const btn = want && [...toList.querySelectorAll('button')].find((b) => b.dataset.ma === want);
    if (btn) btn.click();
  }

  async function loadPhieuCap() {
    if (!toDangChon) return;
    toName.textContent = `- ${toDangChon.ten}`;
    resetDetail();
    App.loading(phieuCap);
    try {
      const rows = await App.api('phieu-cap-btp', { xn: App.xn, to: toDangChon.ma, tuNgay: tuNgay.value, denNgay: denNgay.value });
      App.table(phieuCap, [
        { key: 'soPhieu', label: 'Số phiếu cấp' },
        { key: 'ngayNhan', label: 'Ngày nhận BTP', type: 'date' },
        { key: 'lenhSX', label: 'Lệnh SX' },
        { key: 'maHang', label: 'Mã hàng' },
        { key: 'mua', label: 'Mùa' },
        { key: 'trangThai', label: 'Trạng thái' },
        { key: 'nguoiTao', label: 'Người tạo' },
        { key: 'slDat', label: 'SL đặt', type: 'num', sum: true },
        { key: 'slXuat', label: 'SL cắt đã xuất', type: 'num', sum: true },
        { key: 'slNhan', label: 'SL tổ đã nhận', type: 'num', sum: true },
        { key: 'conLai', label: 'Còn thiếu', type: 'num', sum: true, value: (r) => Math.max(r.slDat - r.slXuat, 0), render: (r) => App.num(Math.max(r.slDat - r.slXuat, 0)) },
        { key: 'tt', label: 'Đáp ứng', render: status, total: (rs) => status({ slDat: rs.reduce((s, r) => s + r.slDat, 0), slXuat: rs.reduce((s, r) => s + r.slXuat, 0) }) },
      ], rows, { onClick: loadDetail, footer: true, empty: 'Tổ chưa có phiếu cấp BTP trong khoảng ngày này' });
    } catch (e) { App.error(phieuCap, e); }
  }

  async function loadDetail(pc) {
    document.querySelectorAll('.pcName').forEach((e) => (e.textContent = `- phiếu ${pc.soPhieu}`));
    App.loading(chiTiet);
    App.loading(phieuXuat);
    const so = encodeURIComponent(pc.soPhieu);
    App.api(`phieu-cap-btp/${so}/chi-tiet`).then((rows) => App.table(chiTiet, [
      { key: 'po', label: 'PO' },
      { key: 'mau', label: 'Màu' },
      { key: 'size', label: 'Size' },
      { key: 'slDat', label: 'SL đặt', type: 'num', sum: true },
      { key: 'slXuat', label: 'SL đã xuất', type: 'num', sum: true },
      { key: 'slNhan', label: 'SL đã nhận', type: 'num', sum: true },
    ], rows, { footer: true })).catch((e) => App.error(chiTiet, e));
    App.api(`phieu-cap-btp/${so}/phieu-xuat`).then((rows) => App.table(phieuXuat, [
      { key: 'barcode', label: 'Tem BTP' },
      { key: 'thoiGianXuat', label: 'Thời gian xuất', type: 'datetime' },
      { key: 'nguoiXuat', label: 'Người quét xuất' },
      { key: 'po', label: 'PO' },
      { key: 'chungLoai', label: 'Chủng loại' },
      { key: 'mau', label: 'Màu' },
      { key: 'size', label: 'Size' },
      { key: 'soLuong', label: 'SL xuất', type: 'num', sum: true },
      { key: 'thoiGianNhan', label: 'Tổ nhận lúc', type: 'datetime' },
    ], rows, { footer: true, empty: 'Khâu cắt chưa quét xuất tem nào cho phiếu này' })).catch((e) => App.error(phieuXuat, e));
  }

  tuNgay.onchange = denNgay.onchange = loadPhieuCap;

  // ---- Tab Chi tiết đặt BTP ----
  ctTuNgay.value = tuNgay.value;
  ctDenNgay.value = denNgay.value;
  document.querySelectorAll('.tabs button').forEach((b) => b.onclick = () => {
    document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('active', x === b));
    document.querySelectorAll('main > section').forEach((sec) => (sec.hidden = sec.id !== b.dataset.tab));
  });

  async function loadCtTo() {
    const list = await App.api('to', { xn: App.xn });
    ctTo.innerHTML = '<option value="">Tất cả</option>' + list.map((t) => `<option value="${App.esc(t.ma)}">${App.esc(t.ten)}</option>`).join('');
    ctResult.innerHTML = '<div class="empty">Chọn điều kiện rồi bấm Xem</div>';
  }

  async function loadChiTietDat() {
    App.loading(ctResult);
    try {
      const rows = await App.api('chi-tiet-dat-btp', {
        xn: App.xn, to: ctTo.value, tuNgay: ctTuNgay.value, denNgay: ctDenNgay.value,
        lenhSX: ctLenh.value.trim(), po: ctPO.value.trim(),
      });
      App.table(ctResult, [
        { key: 'maTo', label: 'Tổ' },
        { key: 'soPhieu', label: 'Số phiếu cấp' },
        { key: 'ngayNhan', label: 'Ngày nhận BTP', type: 'date' },
        { key: 'lenhSX', label: 'Lệnh SX' },
        { key: 'maHang', label: 'Mã hàng' },
        { key: 'po', label: 'PO' },
        { key: 'mau', label: 'Màu' },
        { key: 'size', label: 'Size' },
        { key: 'slDat', label: 'SL đặt', type: 'num', sum: true },
        { key: 'slCap', label: 'SL đã cấp', type: 'num', sum: true },
        { key: 'slNhan', label: 'SL đã nhận', type: 'num', sum: true },
        { key: 'conLai', label: 'Còn thiếu', type: 'num', sum: true, value: (r) => Math.max(r.slDat - r.slCap, 0), render: (r) => App.num(Math.max(r.slDat - r.slCap, 0)) },
        { key: 'tt', label: 'Đáp ứng', render: (r) => status({ slDat: r.slDat, slXuat: r.slCap }), total: (rs) => status({ slDat: rs.reduce((s, r) => s + r.slDat, 0), slXuat: rs.reduce((s, r) => s + r.slCap, 0) }) },
      ], rows, { footer: true, empty: 'Không có dòng đặt BTP nào khớp điều kiện' });
    } catch (e) { App.error(ctResult, e); }
  }
  ctBtn.onclick = loadChiTietDat;
  [ctLenh, ctPO].forEach((el) => (el.onkeydown = (e) => { if (e.key === 'Enter') loadChiTietDat(); }));

  const onXn = () => Promise.all([loadTo(), loadCtTo()]);
  App.header([['Trang chính', '/'], ['Tổ trưởng LEAN', '/lean/'], ['Tình hình đặt BTP']], onXn).then(onXn);
</script>
</body>
</html>
