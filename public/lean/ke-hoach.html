<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kế hoạch phân bổ - DVT Giám sát</title>
<link rel="stylesheet" href="/css/style.css">
<script src="/js/common.js"></script>
</head>
<body>
<main>
  <h1>Kế hoạch phân bổ</h1>
  <div class="tabs">
    <button data-tab="tabPO" class="active">Theo PO</button>
    <button data-tab="tabSize">Theo size</button>
  </div>
  <div class="panel">
    <div class="filters">
      <label>Từ ngày <input type="date" id="tuNgay"></label>
      <label>Đến ngày <input type="date" id="denNgay"></label>
      <label>Tổ <select id="to"><option value="">Tất cả</option></select></label>
      <button id="btn">Xem</button>
    </div>
    <div id="result" class="luoi-cao luoi-10 tab-noi" data-tab="tabPO"></div>
    <div id="theoSize" class="luoi-cao luoi-gon tab-noi" data-tab="tabSize" hidden><div class="empty">Bấm Xem để tải kế hoạch theo size</div></div>
  </div>
  <div class="panel tab-noi" data-tab="tabPO">
    <h2>Size breakdown <span id="tenDong"></span></h2>
    <div id="size"><div class="empty">Bấm vào một dòng kế hoạch để xem SL phân bổ theo size</div></div>
    <div class="note">SL phân bổ theo màu x size lấy từ OMM_KeHoachThang_SBD. Chưa có số hoàn thành theo size (HiPro không ghi size).</div>
  </div>
</main>
<script>
  const iso = (d) => d.toISOString().slice(0, 10);
  const now = new Date();
  tuNgay.value = iso(new Date(now.getFullYear(), now.getMonth(), 1));
  denNgay.value = iso(new Date(now.getFullYear(), now.getMonth() + 1, 0));
  let rows = [];

  async function loadTo() {
    const list = await App.api('to', { xn: App.xn });
    to.innerHTML = '<option value="">Tất cả</option>' + list.map((t) => `<option value="${t.ma}">${t.ten}</option>`).join('');
  }
  function draw() {
    const data = to.value ? rows.filter((r) => r.maTo === to.value) : rows;
    App.table(result, [
      { key: 'tenTo', label: 'Tổ' },
      { key: 'maHang', label: 'Mã hàng' },
      { key: 'po', label: 'PO' },
      { key: 'lenhSX', label: 'Lệnh SX' },
      { key: 'slLenh', label: 'SL PO trong lệnh', type: 'num' },
      { key: 'soLuong', label: 'SL kế hoạch', type: 'num', sum: true },
      { key: 'slSX', label: 'SL SX', type: 'num', sum: true },
      { key: 'conLai', label: 'Còn lại', type: 'num', sum: true },
      { key: 'tl', label: '% hoàn thành', render: (r) => (r.soLuong == null ? '' : App.pctTag(r.slSX, r.soLuong)), total: (rs) => App.pctTag(rs.reduce((s, r) => s + Number(r.slSX || 0), 0), rs.reduce((s, r) => s + Number(r.soLuong || 0), 0)) },
      { key: 'ngayVaoChuyen', label: 'Vào chuyền', type: 'date' },
      { key: 'ngayBatDau', label: 'Bắt đầu may', type: 'date' },
      { key: 'ngayKetThuc', label: 'Kết thúc may', type: 'date' },
    ], data, { footer: true, onClick: loadSize });
  }
  // Bảng ma trận màu x size của dòng kế hoạch
  async function loadSize(r) {
    tenDong.textContent = `- Tổ ${r.tenTo} / ${r.maHang} / PO ${r.po || ''}`;
    App.loading(size);
    try {
      const data = await App.api('ke-hoach-phan-bo/size', { xn: App.xn, tuNgay: tuNgay.value, denNgay: denNgay.value, to: r.maTo, maHang: r.maHang, po: r.po || '' });
      // Mỗi size 1 đại diện (STT điều tiết nhỏ nhất), rồi xếp theo App.sizeCmp
      const dsSize = new Map();
      data.forEach((x) => { const c = dsSize.get(x.size); if (!c || (x.thuTuSize != null && (c.thuTuSize == null || x.thuTuSize < c.thuTuSize))) dsSize.set(x.size, x); });
      const sizes = [...dsSize.values()].sort(App.sizeCmp).map((x) => x.size);
      const maus = new Map();
      data.forEach((x) => {
        const m = maus.get(x.mau) || { mau: x.mau, tong: 0 };
        m[`s:${x.size}`] = (m[`s:${x.size}`] || 0) + Number(x.soLuong || 0);
        m.tong += Number(x.soLuong || 0);
        maus.set(x.mau, m);
      });
      App.table(size, [
        { key: 'mau', label: 'Màu' },
        ...sizes.map((sz) => ({ key: `s:${sz}`, label: App.esc(sz), type: 'num', sum: true })),
        { key: 'tong', label: 'Tổng', type: 'num', sum: true },
      ], [...maus.values()], { footer: true, empty: 'Dòng kế hoạch này chưa có size breakdown' });
    } catch (e) { App.error(size, e); }
  }

  async function load() {
    tenDong.textContent = '';
    size.innerHTML = '<div class="empty">Bấm vào một dòng kế hoạch để xem SL phân bổ theo size</div>';
    App.loading(result);
    try {
      rows = await App.api('ke-hoach-phan-bo', { xn: App.xn, tuNgay: tuNgay.value, denNgay: denNgay.value });
      draw();
    } catch (e) { App.error(result, e); }
  }
  // ---- Tab Theo size: tổ x mã hàng x PO x màu x size, SL từ SBD ----
  let tab = 'tabPO';
  let sizeRows = null;
  function drawSize() {
    const data = (to.value ? sizeRows.filter((r) => r.maTo === to.value) : sizeRows).slice().sort((a, b) =>
      (Number(a.maTo) || 999) - (Number(b.maTo) || 999) || String(a.maHang).localeCompare(String(b.maHang)) || String(a.po).localeCompare(String(b.po))
      || String(a.mau).localeCompare(String(b.mau)) || App.sizeCmp(a, b));
    App.table(theoSize, [
      { key: 'maTo', label: 'Tổ' },
      { key: 'maHang', label: 'Mã hàng' },
      { key: 'po', label: 'PO' },
      { key: 'lenhSX', label: 'Lệnh SX' },
      { key: 'mau', label: 'Màu' },
      { key: 'size', label: 'Size' },
      { key: 'slLenh', label: 'SL KH theo lệnh', type: 'num', sum: true },
      { key: 'slPhanBo', label: 'SL phân bổ (SBD)', type: 'num', sum: true },
    ], data, { footer: true, maxRows: 2000, empty: 'Không có kế hoạch theo size trong khoảng ngày này' });
  }
  async function loadSizeTab() {
    App.loading(theoSize);
    try {
      sizeRows = await App.api('ke-hoach-phan-bo/theo-size', { xn: App.xn, tuNgay: tuNgay.value, denNgay: denNgay.value });
      drawSize();
    } catch (e) { App.error(theoSize, e); }
  }
  document.querySelectorAll('.tabs button').forEach((b) => b.onclick = () => {
    tab = b.dataset.tab;
    document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('active', x === b));
    document.querySelectorAll('.tab-noi').forEach((el) => (el.hidden = el.dataset.tab !== tab));
    if (tab === 'tabSize' && !sizeRows) loadSizeTab();
  });

  btn.onclick = () => { sizeRows = null; load(); if (tab === 'tabSize') loadSizeTab(); };
  to.onchange = () => { draw(); if (sizeRows) drawSize(); };
  App.header([['Trang chính', '/'], ['Tổ trưởng LEAN', '/lean/'], ['Kế hoạch phân bổ']], () => loadTo().then(btn.onclick))
    .then(() => loadTo()).then(load);
</script>
</body>
</html>
