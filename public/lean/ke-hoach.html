<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kế hoạch phân bổ - DVT Giám sát</title>
<link rel="stylesheet" href="/css/style.css">
<script src="/js/common.js"></script>
</head>
<body>
<main>
  <h1>Kế hoạch phân bổ</h1>
  <div class="panel">
    <div class="filters">
      <label>Từ ngày <input type="date" id="tuNgay"></label>
      <label>Đến ngày <input type="date" id="denNgay"></label>
      <label>Tổ <select id="to"><option value="">Tất cả</option></select></label>
      <button id="btn">Xem</button>
    </div>
    <div id="result" class="luoi-cao luoi-10"></div>
  </div>
  <div class="panel">
    <h2>Size breakdown <span id="tenDong"></span></h2>
    <div id="size"><div class="empty">Bấm vào một dòng kế hoạch để xem SL phân bổ theo size</div></div>
    <div class="note">SL phân bổ theo màu x size lấy từ OMM_KeHoachThang_SBD. Chưa có số hoàn thành theo size (HiPro không ghi size).</div>
  </div>
</main>
<script>
  const iso = (d) => d.toISOString().slice(0, 10);
  const now = new Date();
  tuNgay.value = iso(new Date(now.getFullYear(), now.getMonth(), 1));
  denNgay.value = iso(new Date(now.getFullYear(), now.getMonth() + 1, 0));
  let rows = [];

  async function loadTo() {
    const list = await App.api('to', { xn: App.xn });
    to.innerHTML = '<option value="">Tất cả</option>' + list.map((t) => `<option value="${t.ma}">${t.ten}</option>`).join('');
  }
  function draw() {
    const data = to.value ? rows.filter((r) => r.maTo === to.value) : rows;
    App.table(result, [
      { key: 'tenTo', label: 'Tổ' },
      { key: 'maHang', label: 'Mã hàng' },
      { key: 'soLuong', label: 'SL kế hoạch', type: 'num', sum: true },
      { key: 'slSX', label: 'SL SX', type: 'num', sum: true },
      { key: 'conLai', label: 'Còn lại', type: 'num', sum: true },
      { key: 'tl', label: '% hoàn thành', render: (r) => App.pctTag(r.slSX, r.soLuong), total: (rs) => App.pctTag(rs.reduce((s, r) => s + Number(r.slSX || 0), 0), rs.reduce((s, r) => s + Number(r.soLuong || 0), 0)) },
      { key: 'ngayVaoChuyen', label: 'Vào chuyền', type: 'date' },
      { key: 'ngayBatDau', label: 'Bắt đầu may', type: 'date' },
      { key: 'ngayKetThuc', label: 'Kết thúc may', type: 'date' },
    ], data, { footer: true, onClick: loadSize });
  }
  // Bảng ma trận màu x size của dòng kế hoạch
  async function loadSize(r) {
    tenDong.textContent = `- Tổ ${r.tenTo} / ${r.maHang}`;
    App.loading(size);
    try {
      const data = await App.api('ke-hoach-phan-bo/size', { xn: App.xn, tuNgay: tuNgay.value, denNgay: denNgay.value, to: r.maTo, maHang: r.maHang });
      // Mỗi size 1 đại diện (STT điều tiết nhỏ nhất), rồi xếp theo App.sizeCmp
      const dsSize = new Map();
      data.forEach((x) => { const c = dsSize.get(x.size); if (!c || (x.thuTuSize != null && (c.thuTuSize == null || x.thuTuSize < c.thuTuSize))) dsSize.set(x.size, x); });
      const sizes = [...dsSize.values()].sort(App.sizeCmp).map((x) => x.size);
      const maus = new Map();
      data.forEach((x) => {
        const m = maus.get(x.mau) || { mau: x.mau, tong: 0 };
        m[`s:${x.size}`] = (m[`s:${x.size}`] || 0) + Number(x.soLuong || 0);
        m.tong += Number(x.soLuong || 0);
        maus.set(x.mau, m);
      });
      App.table(size, [
        { key: 'mau', label: 'Màu' },
        ...sizes.map((sz) => ({ key: `s:${sz}`, label: App.esc(sz), type: 'num', sum: true })),
        { key: 'tong', label: 'Tổng', type: 'num', sum: true },
      ], [...maus.values()], { footer: true, empty: 'Dòng kế hoạch này chưa có size breakdown' });
    } catch (e) { App.error(size, e); }
  }

  async function load() {
    tenDong.textContent = '';
    size.innerHTML = '<div class="empty">Bấm vào một dòng kế hoạch để xem SL phân bổ theo size</div>';
    App.loading(result);
    try {
      rows = await App.api('ke-hoach-phan-bo', { xn: App.xn, tuNgay: tuNgay.value, denNgay: denNgay.value });
      draw();
    } catch (e) { App.error(result, e); }
  }
  btn.onclick = load;
  to.onchange = draw;
  App.header([['Trang chính', '/'], ['Tổ trưởng LEAN', '/lean/'], ['Kế hoạch phân bổ']], () => loadTo().then(load))
    .then(() => loadTo()).then(load);
</script>
</body>
</html>
